<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALP Astrology</title>
<link rel="icon" type="image/png" href="https://sanstudio-hub.github.io/HTML/ALP/alpastrology.png">
<style>
  /* ALP Astrology theme: light orange and white, deep orange accents on warm cream. Mobile first; wider screens get more room. */
  :root { color-scheme: light; --bg: #fffaf4; --card: #ffffff; --ink: #3b2314; --muted: #7b6755; --line: #f1e3d1; --accent: #b25a14; --accent-dark: #8f460d; --accent-soft: #fdeeda;
    --amber: #e0a04a; --amber-soft: #fdf1dd; --ok: #2e7d5b; --ok-soft: #e6f3ec; --bad: #b8433b; --bad-soft: #fbeceb; --warn: #a86f12; --warn-soft: #fbf1dc;
    --shadow: 0 1px 2px rgba(59,35,20,.05), 0 10px 28px rgba(59,35,20,.09); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif; }
  .hero { height: 190px; color: var(--ink); padding: 18px 16px 0; background:
    radial-gradient(1.5px 1.5px at 12% 28%, rgba(255,255,255,.95) 50%, transparent 52%), radial-gradient(1px 1px at 27% 62%, rgba(255,255,255,.8) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 44% 20%, rgba(255,255,255,.9) 50%, transparent 52%), radial-gradient(1px 1px at 58% 70%, rgba(255,255,255,.7) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 73% 34%, rgba(255,255,255,.9) 50%, transparent 52%), radial-gradient(1px 1px at 88% 58%, rgba(255,255,255,.8) 50%, transparent 52%),
    radial-gradient(120px 90px at 86% 0%, rgba(255,255,255,.45), transparent 70%),
    linear-gradient(160deg, #fbdcb0, #f5be80 65%, #eea35a); }
  .hero .brand { max-width: 920px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--accent-dark); color: var(--accent-dark); display: grid; place-items: center; font-size: 1.2rem; background: rgba(255,255,255,.55); flex: none; }
  .brand b { display: block; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; }
  .brand small { display: block; color: #7a4a22; font-size: .8rem; letter-spacing: .04em; }
  main { max-width: 920px; margin: -118px auto 0; padding: 0 16px 40px; position: relative; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  h2::before { content: ""; display: inline-block; width: 4px; height: 1em; border-radius: 2px; background: var(--amber); margin-right: 8px; vertical-align: -.14em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .login { max-width: 420px; margin: 74px auto 0; padding: 24px; }
  .login small { display: block; color: var(--muted); margin: 2px 0 6px; }
  .login input { width: 100%; }
  .login button { width: 100%; margin-top: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 22px 0 18px; color: var(--ink); }
  .bar h1 { color: var(--ink); }
  .bar .muted { color: #7a4a22; }
  .bar button { background: rgba(255,255,255,.65); color: var(--ink); border-color: rgba(59,35,20,.22); min-height: 42px; padding: 8px 14px; }
  .bar button:hover:not(:disabled) { background: rgba(255,255,255,.9); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  label.row { margin: 0; font-weight: 500; color: var(--ink); }
  textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid #e6d3bd; border-radius: 12px; color: var(--ink); background: #fff; }
  input, select { font: inherit; padding: 10px 12px; border: 1px solid #e6d3bd; border-radius: 12px; background: #fff; color: var(--ink); min-width: 0; min-height: 48px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(178,90,20,.2); }
  input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 12px; border: 1px solid #e6d3bd; background: #fff; color: var(--ink); cursor: pointer; min-height: 48px; transition: background .15s, transform .05s; }
  button:hover:not(:disabled) { background: #fff5e8; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(178,90,20,.28); }
  button.primary:hover:not(:disabled) { background: var(--accent-dark); }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); border-color: #ecc9c5; }
  button:disabled { opacity: .55; cursor: default; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--amber-soft); color: var(--accent-dark); display: grid; place-items: center; font-weight: 700; flex: none; border: 1.5px solid var(--amber); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--amber-soft); color: #8a4b12; margin-left: 8px; vertical-align: middle; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { min-height: 50px; border-radius: 14px; padding: 8px 4px; }
  button.on-PRESENT { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.on-ABSENT { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.on-EXCUSED { background: var(--warn); border-color: var(--warn); color: #fff; }
  .coach-row { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .coach-row:last-child { border-bottom: 0; }
  .coach-row .name { font-weight: 600; font-size: 1.05rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; border-radius: 12px; color: var(--muted); }
  .tabs button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-dark); }
  .tabs button[aria-selected=true] { background: var(--accent); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .stat { border-radius: 14px; padding: 10px 12px; background: #fbf4ea; border: 1px solid var(--line); }
  .stat b { display: block; font-size: 1.5rem; line-height: 1.1; }
  .stat span { font-size: .75rem; color: var(--muted); font-weight: 600; }
  .stat.PRESENT { background: var(--ok-soft); } .stat.PRESENT b { color: var(--ok); }
  .stat.ABSENT { background: var(--bad-soft); } .stat.ABSENT b { color: var(--bad); }
  .stat.EXCUSED { background: var(--warn-soft); } .stat.EXCUSED b { color: var(--warn); }
  .muted { color: var(--muted); }
  .student { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .student:last-child { border-bottom: 0; }
  .student .name { font-weight: 600; flex: 1 1 200px; }
  .idtag { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; background: var(--amber-soft); color: #8a4b12; font-size: .75rem; font-weight: 600; vertical-align: middle; letter-spacing: .02em; }
  .banner { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 20; width: calc(100% - 24px); max-width: 560px; padding: 12px 16px; border-radius: 14px; display: none; font-weight: 600; box-shadow: 0 12px 32px rgba(59,35,20,.25); }
  .banner.error { display: block; background: var(--bad-soft); border: 1px solid #e8b9b4; color: #8f2f28; }
  .banner.info { display: block; background: var(--ok-soft); border: 1px solid #b8dcc9; color: #1f5f43; }
  .empty { text-align: center; padding: 26px 8px; color: var(--muted); }
  #printView { display: none; }
  #printView h1 { margin-bottom: 4px; }
  #printView table { font-size: 11pt; margin-top: 10px; }
  #printView th, #printView td { border: 1px solid #999; padding: 4px 6px; }
  @media print {
    body { background: #fff; }
    .hero { display: none; }
    main { margin: 0; padding: 0; }
    main > *:not(#printView) { display: none !important; }
    #printView { display: block; }
    @page { margin: 14mm; }
  }
  .credit { text-align: center; color: var(--muted); font-size: .85rem; margin: 22px 0 4px; }
  .credit a { color: #8a4b12; font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--amber); }
  .credit a:hover { color: var(--accent-dark); }
  .login-logo { display: block; width: 160px; height: 160px; margin: -18px auto -8px; }
  .hero-badge { display: none; margin-left: auto; width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 2px solid var(--amber); overflow: hidden; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.28); flex: none; }
  body.signed-in .hero-badge { display: grid; }
  .hero-badge img { width: 128%; height: 128%; max-width: none; }
  .hidden { display: none !important; }
  .scroll { overflow-x: auto; }

  /* phones: bottom tab bar, report rows as cards, full-width form fields */
  @media (max-width: 700px) {
    main { padding-bottom: 110px; }
    .card { padding: 16px; border-radius: 16px; }
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; border-radius: 18px 18px 0 0; border-width: 1px 0 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(59,35,20,.12); }
    .tabs button { min-height: 52px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .resp tr.head { display: none; }
    .resp, .resp tr, .resp td { display: block; }
    .resp tr { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; background: #fffaf2; }
    .resp td { border: 0; padding: 6px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .resp td::before { content: attr(data-label); color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .row > input, .row > select, .row > label.row { flex: 1 1 100%; }
    .row > label.row { display: flex; }
    .row > label.row input { flex: 1; }
    .row > button { flex: 1 1 100%; }
    .bar { flex-wrap: nowrap; gap: 8px; }
    .bar .who { flex: 1 1 0; min-width: 0; }
    .bar .who h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.1rem; }
    .bar .who > div:last-child { min-width: 0; }
    .bar .row { flex-wrap: nowrap; flex: none; gap: 6px; }
    .bar .row > button { flex: none; padding: 8px 10px; font-size: .88rem; min-height: 40px; }
    .student > input, .student > select { flex: 1 1 100%; }
    .student > .row, .student .row { width: 100%; }
    .student .row > button { flex: 1 1 40%; }
    .student > button { flex: 1 1 100%; }
  }
  @media (min-width: 701px) {
    .coach-row { grid-template-columns: 1fr 360px; align-items: center; }
  }

  /* ---- students, progress, profile ---- */
  h2.section { margin: 20px 4px 10px; font-size: 1rem; color: var(--ink); }
  .stu-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; }
  .stu-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .stu-top .name { font-weight: 600; font-size: 1.05rem; flex: 1 1 160px; margin: 0; }
  .meta { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .88rem; }
  .stu-progress { display: flex; gap: 10px; align-items: center; font-size: .85rem; }
  .stu-progress .muted { white-space: nowrap; }
  .meter { display: block; flex: 1 1 90px; min-width: 70px; height: 9px; background: #f3e6d3; border-radius: 99px; overflow: hidden; }
  .meter .fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e0a04a, #b25a14); border-radius: 99px; transition: width .35s ease; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-dark); white-space: nowrap; }
  .tag.course { background: var(--amber-soft); color: #8a4b12; }
  .tag.ok { background: var(--ok-soft); color: #1f5f43; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: #8f2f28; }
  .tag.info { background: #eaf1fb; color: #2b4f86; }
  .flags { display: flex; flex-wrap: wrap; gap: 4px; }
  a.call { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid #e6d3bd; background: #fff; color: var(--accent-dark); font-weight: 600; text-decoration: none; }
  button.small { min-height: 40px; padding: 6px 14px; font-size: .9rem; }
  button.back { margin-bottom: 10px; border: 0; padding-left: 4px; color: var(--accent-dark); }
  .profile h2 { margin: 0; }
  .student .sub { display: block; font-size: .8rem; font-weight: 400; margin-top: 2px; }
  .lesson { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lesson:last-child { border-bottom: 0; }
  .lesson label.row { flex: 1 1 auto; display: flex; flex-wrap: nowrap; align-items: center; }
  .lesson label.row input { flex: none; }
  .lesson .lesson-title { font-weight: 600; gap: 10px; }
  .lesson .when { font-size: .8rem; }
  .lesson-note { grid-column: 1 / -1; min-height: 40px; padding: 6px 10px; font-size: .9rem; }
  .lesson-note:disabled { background: #faf6ee; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .daychip { padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: #f3efe6; }
  .daychip.PRESENT { background: var(--ok-soft); color: #1f5f43; }
  .daychip.ABSENT { background: var(--bad-soft); color: #8f2f28; }
  .daychip.EXCUSED { background: var(--warn-soft); color: var(--warn); }
  .review { padding: 10px 0; border-top: 1px solid var(--line); }
  .review p { margin: 4px 0 0; }
  .row.gap { margin-top: 10px; }
  .course { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .course textarea { margin-top: 4px; }
  .person { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .person .name { font-weight: 600; }
  input[type=search] { width: 100%; margin-bottom: 6px; }
  .loading { padding: 18px 4px; }
  @media (max-width: 700px) {
    .stu-top button { flex: none; }
    .resp td .stu-progress { flex: 1; justify-content: flex-end; }
    .resp td .meter { max-width: 120px; }
    .tabs { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
    .tabs button { padding-left: 4px; padding-right: 4px; font-size: .9rem; }
    .person .row > input { flex: 1 1 60%; }
    .person .row > button { flex: 1 1 30%; }
  }
</style>
</head>
<body>
<header class="hero"><div class="brand"><div class="logo" aria-hidden="true">&#10022;</div><div><b>ALP Astrology</b><small>Student progress</small></div><span class="hero-badge"><img class="brandimg" src="https://sanstudio-hub.github.io/HTML/ALP/alpastrology.png" alt="ALP Astrology logo" width="77" height="77"></span></div></header>
<main>
  <div id="banner" class="banner" role="alert"></div>

  <section id="loginView" class="card login hidden">
    <img class="brandimg login-logo" src="https://sanstudio-hub.github.io/HTML/ALP/alpastrology.png" alt="ALP Astrology logo" width="160" height="160">
    <h1>Welcome</h1><small>Sign in with your username and PIN</small>
    <label for="loginUser">Username</label>
    <input id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="loginPin">PIN</label>
    <input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password">
    <button id="loginBtn" class="primary">Sign in</button>
  </section>

  <section id="printView" aria-hidden="true"></section>

  <section id="appView" class="hidden">
    <div class="bar">
      <div class="who"><div id="avatar" class="avatar"></div><div><h1 id="hello"></h1><small id="roleLine" class="muted"></small></div></div>
      <div class="row">
        <button id="pinBtn">Change PIN</button>
        <button id="logoutBtn" class="ghost">Sign out</button>
      </div>
    </div>
    <div id="pinForm" class="card hidden">
      <label for="oldPin">Current PIN</label><input id="oldPin" type="password" inputmode="numeric" autocomplete="current-password">
      <label for="newPin">New PIN (6-12 digits)</label><input id="newPin" type="password" inputmode="numeric" autocomplete="new-password">
      <p class="row"><button id="pinSave" class="primary">Save new PIN</button><button id="pinCancel">Cancel</button></p>
    </div>
    <div id="content"></div>
  </section>
  <footer class="credit">Developed by <a href="https://a-santhosh-hub.github.io/in/" target="_blank" rel="noopener noreferrer">SanStudio</a></footer>
</main>

<script>
(function () {
  'use strict';
  var STATUS_LABEL = { PRESENT: 'Present', ABSENT: 'Absent', EXCUSED: 'Excused' };
  var token = '';
  var me = null;
  var overview = null;
  var API_URL = '';                                            // set only in the copy hosted outside Google (see tools/build-github-page.mjs)

  function $(id) { return document.getElementById(id); }
  function el(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (key) {
      if (key === 'text') node.textContent = props[key];
      else if (key === 'class') node.className = props[key];
      else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), props[key]);
      else if (props[key] !== false && props[key] !== null && props[key] !== undefined) node.setAttribute(key, props[key] === true ? '' : props[key]);
    });
    for (var i = 2; i < arguments.length; i++) { var child = arguments[i]; if (child) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child); }
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function banner(kind, message) {
    var b = $('banner');
    b.className = 'banner' + (kind ? ' ' + kind : '');
    b.textContent = message || '';
  }
  // Many coaches may save at the same moment. "Server is busy" means the server did nothing yet, so any call may be retried safely.
  // A dropped connection is retried only for calls that just read data or sign in, never for ones that save (they could be saved twice).
  var RETRY_MS = 1000;
  var BUSY = /server is busy/i;
  var SAFE_TO_REPEAT = { api_login: 1, api_me: 1, api_coachToday: 1, api_adminOverview: 1, api_attendanceReport: 1, api_attendanceRange: 1 };
  function pause(attempt) { return new Promise(function (resolve) { setTimeout(resolve, RETRY_MS * attempt + Math.floor(Math.random() * RETRY_MS * 0.7)); }); }
  function viaFetch(name, args) {
    if (!API_URL) return Promise.reject(new Error('This page is not connected to the server yet.'));
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args: args }), redirect: 'follow', credentials: 'omit' })
      .then(function (response) { return response.json(); })
      .then(function (body) { return { body: body }; }, function () { return { down: true }; })
      .then(function (result) {
        if (result.down) { var gone = new Error('Could not reach the server. Check your internet connection and try again.'); gone.down = true; throw gone; }
        if (result.body && result.body.ok) return result.body.data;
        throw new Error(result.body && result.body.error ? result.body.error : 'Request failed.');
      });
  }
  function viaGoogle(name, args) {
    return new Promise(function (resolve, reject) {
      var run = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) { reject(new Error(error && error.message ? error.message : 'Request failed.')); });
      run[name].apply(run, args);
    });
  }
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    var send = (typeof google === 'undefined' || !google.script || !google.script.run) ? viaFetch : viaGoogle;
    var attempts = 0;
    function once() {
      attempts++;
      return send(name, args).catch(function (error) {
        if (BUSY.test(error.message) && attempts < 4) return pause(attempts).then(once);
        if (error.down && SAFE_TO_REPEAT[name] && attempts < 3) return pause(attempts).then(once);
        throw error;
      });
    }
    return once();
  }
  function guarded(promise, done) {
    return promise.then(function (value) { banner('', ''); if (done) done(value); return value; }).catch(function (error) {
      if (/sign in again/i.test(error.message)) { signedOut(); }
      banner('error', error.message);
    });
  }
  function saveToken(value) { token = value; try { if (value) sessionStorage.setItem('att_token', value); else sessionStorage.removeItem('att_token'); } catch (e) { /* storage may be blocked */ } }

  // ------------------------------------------------------------------ small building blocks
  var DECISION_LABEL = { CONTINUE: 'Continue', PROMOTE: 'Promote to next course', REPEAT: 'Repeat / extend', NEEDS_SUPPORT: 'Needs support' };

    var note = loading(body);

  function todayString() { return new Date(Date.now() + 19800000).toISOString().slice(0, 10); }      // India time (UTC+05:30)

  function renderReport(body, date) {
    var card = el('div', { class: 'card' });

  // ------------------------------------------------------------------ export (admin only: the data comes from an admin-only server function)
  var LABEL_ALL = { PRESENT: 'Present', ABSENT: 'Absent', EXCUSED: 'Excused', NOT_RECORDED: 'Not recorded' };
  var COLUMNS = [['Date', 'date', 12], ['Student ID', 'student_id', 14], ['Student', 'student', 28], ['Coach', 'coach', 24], ['Status', 'status', 14], ['Marked by', 'marked_by', 24], ['Marked at (IST)', 'marked_at', 18]];
  function cellText(row, key) { return key === 'status' ? LABEL_ALL[row.status] : row[key]; }
  function download(name, blob) {
    var url = URL.createObjectURL(blob);

    setTimeout(function () { document.body.removeChild(link); URL.revokeObjectURL(url); }, 1500);
  }
  function renderExport(body) {
    var from = el('input', { type: 'date', value: todayString().slice(0, 8) + '01', 'aria-label': 'From date' });

      el('div', { class: 'row' }, el('label', { class: 'row' }, 'From', from), el('label', { class: 'row' }, 'To', to), excel, pdf));
    function run(kind) {
      [excel, pdf].forEach(function (b) { b.disabled = true; });
      guarded(api('api_attendanceRange', token, from.value, to.value), function (data) {
        var base = 'attendance_' + data.from + '_to_' + data.to;
        if (kind === 'excel') { download(base + '.xlsx', makeXlsx(data)); banner('info', 'Excel file downloaded (' + data.rows.length + ' rows).'); }
        else printReport(data);
      }).then(function () { [excel, pdf].forEach(function (b) { b.disabled = false; }); });
    }
    excel.addEventListener('click', function () { run('excel'); });
    pdf.addEventListener('click', function () { run('pdf'); });

  function printReport(data) {

    view.appendChild(el('p', { text: data.from + ' to ' + data.to + '   |   Present ' + data.summary.PRESENT + ', Absent ' + data.summary.ABSENT + ', Excused ' + data.summary.EXCUSED + ', Not recorded ' + data.summary.NOT_RECORDED }));

    view.appendChild(table);
    setTimeout(function () { window.print(); }, 100);
  }

  // A small .xlsx writer: an Excel file is a zip of XML files (stored, not compressed). No outside library is needed.
  var CRC_TABLE = (function () { var t = [], n, k, c; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(bytes) { var c = 0xFFFFFFFF; for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

    function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
    files.forEach(function (file) {
      var name = encoder.encode(file[0]), data = encoder.encode(file[1]), crc = crc32(data);
      var head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
      parts.push(new Uint8Array(head), name, data);
      central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset))), name);
      offset += head.length + name.length + data.length;
    });
    var centralSize = 0; central.forEach(function (c) { centralSize += c.length; });
    var end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(centralSize), u32(offset), u16(0)));
    return new Blob(parts.concat(central, [end]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function xml(text) { return String(text).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function columnName(i) { return String.fromCharCode(65 + i); }
  function makeXlsx(data) {
    var NS = 'h' + 'ttp://schemas.openxmlformats.org/';                                 // the namespace is an identifier, not a download
    var rows = [COLUMNS.map(function (c) { return c[0]; })].concat(data.rows.map(function (row) { return COLUMNS.map(function (c) { return cellText(row, c[1]); }); }));
    var sheetRows = rows.map(function (cells, r) {
      return '<row r="' + (r + 1) + '">' + cells.map(function (value, c) {
        return '<c r="' + columnName(c) + (r + 1) + '" t="inlineStr"' + (r === 0 ? ' s="1"' : '') + '><is><t>' + xml(value) + '</t></is></c>';       // text only, so no cell is ever a formula
      }).join('') + '</row>';
    }).join('');
    var cols = '<cols>' + COLUMNS.map(function (c, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c[2] + '" customWidth="1"/>'; }).join('') + '</cols>';
    var head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    return zip([
      ['[Content_Types].xml', head + '<Types xmlns="' + NS + 'package/2006/content-types' + '"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', head + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets><sheet name="Attendance" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', head + '<styleSheet xmlns="' + NS + 'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
      ['xl/worksheets/sheet1.xml', head + '<worksheet xmlns="' + NS + 'spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + sheetRows + '</sheetData></worksheet>']
    ]);
  }

  // ------------------------------------------------------------------ sign in, PIN
  function start() {
    var saved = '';
    try { saved = sessionStorage.getItem('att_token') || ''; } catch (e) { saved = ''; }
    if (saved) {
      token = saved;
      api('api_me', token).then(function (info) { me = info; showApp(); }).catch(function () { signedOut(); });
    } else {
      $('loginView').classList.remove('hidden');
    }
  }
  $('loginBtn').addEventListener('click', function () {
    var button = $('loginBtn'); button.disabled = true;
    guarded(api('api_login', $('loginUser').value, $('loginPin').value), function (result) {
      saveToken(result.token); me = { name: result.name, role: result.role }; $('loginPin').value = ''; showApp();
    }).then(function () { button.disabled = false; });
  });
  $('loginPin').addEventListener('keydown', function (event) { if (event.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').addEventListener('click', function () { api('api_logout', token).then(signedOut, signedOut); banner('', ''); });
  $('pinBtn').addEventListener('click', function () { $('pinForm').classList.toggle('hidden'); });

    if (img.complete && img.naturalWidth === 0) hide();
  });
  start();
